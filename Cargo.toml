[package]
name = "git-scanner"
version = "0.2.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
futures = "0.3"

# Channel communication
flume = "0.11"
crossbeam-channel = "0.5"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Parallel processing
rayon = "1.10"

# Caching
moka = { version = "0.12", features = ["sync"] }

# Pattern matching - FAST
regex = "1.10"
aho-corasick = "1.1"
memchr = "2.6"

# Lazy static initialization
once_cell = "1.19"

# Cryptography
secp256k1 = { version = "0.27", features = ["global-context"] }
ethers = { version = "2.0", features = ["rustls"] }
hex = "0.4"
sha2 = "0.10"

# Telegram bot
teloxide = { version = "0.12", features = ["macros"] }

# Environment variables
dotenv = "0.15"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Memory allocator (Linux/MacOS only)
[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = "0.5"

# BIP39 for mnemonic
coins-bip39 = "0.8"

# Fast synchronization
parking_lot = "0.12"

# CPU detection
num_cpus = "1.16"

# WebSocket client (pure Rust)
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2